<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPilot</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <div class="decoration dot-one"></div>
    <div class="decoration dot-two"></div>
    <div class="decoration dot-three"></div>

    <div class="container">

        <div class="status">
            <div class="status-dot"></div>
            Agent ready
        </div>

        <div class="header">
            <div class="logo-icon">🛒</div>

            <div>
                <h1>PantryPilot</h1>
                <p class="subtitle">
                    Your autonomous household shopping assistant
                </p>
            </div>
        </div>

        <div class="prompt-title">
            What should PantryPilot manage?

            <p class="hint">
                Try: “Manage my kitchen while minimizing unnecessary purchases.”
            </p>
        </div>

        <textarea
            id="prompt"
            rows="4"
            placeholder="Enter your request..."
        >Manage my kitchen while minimizing unnecessary purchases.</textarea>

        <button id="run-button">
            Run Agent →
        </button>

        <h2 class="section-title">
            <span>✦</span>
            Agent Response
        </h2>

        <div id="response">
            Agent response will appear here.
        </div>

        <h2 class="section-title">
            <span>✦</span>
            Execution Steps
        </h2>

        <div id="steps">
            Execution steps will appear here.
        </div>

    </div>

    <script src="/static/app.js"></script>

</body>

</html>
